[workspace]
resolver = "2"
members = ["crates/customs-core", "crates/customs"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.77"
repository = "https://github.com/kbongort/customs-lint"
description = "Python import-boundary linter"

[workspace.dependencies]
customs-core = { path = "crates/customs-core" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "time", "sync"] }
tower-lsp-server = "0.23"
serde_json = "1"
